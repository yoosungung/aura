# Product images → GHCR (latest + sha-<short>; retain 3 tagged versions).
# Policy: deploy/docs/ghcr-images.md · gate: deploy/scripts/check-ghcr-images.sh
name: images

on:
  push:
    branches: [main]
    paths:
      - "services/gateway/**"
      - "services/llm-gateway/**"
      - "services/nats-rpc-bridge/**"
      - "services/nats-task-bridge/**"
      - "services/control/**"
      - "services/admin-ui/**"
      - "services/object-store/get-object.js"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "scaffolds/**"
      - ".github/workflows/images.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: aura-gateway
            context: .
            file: services/gateway/Dockerfile
          - name: aura-llm-gateway
            context: .
            file: services/llm-gateway/Dockerfile
          - name: aura-nats-rpc-bridge
            context: .
            file: services/nats-rpc-bridge/Dockerfile
          - name: aura-nats-task-bridge
            context: .
            file: services/nats-task-bridge/Dockerfile
          - name: aura-control-admin
            context: .
            file: services/control/Dockerfile
          - name: aura-admin-ui
            context: .
            file: services/admin-ui/Dockerfile
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max

  cleanup:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        name:
          - aura-gateway
          - aura-llm-gateway
          - aura-nats-rpc-bridge
          - aura-nats-task-bridge
          - aura-control-admin
          - aura-admin-ui
    steps:
      - name: Retain last 3 tagged versions
        uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          owner: ${{ github.repository_owner }}
          package: ${{ matrix.name }}
          token: ${{ secrets.GITHUB_TOKEN }}
          keep-n-tagged: 3
          delete-untagged: true
