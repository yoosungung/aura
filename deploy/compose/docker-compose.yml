services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: aura
      POSTGRES_PASSWORD: aura
      POSTGRES_DB: aura
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aura -d aura"]
      interval: 2s
      timeout: 5s
      retries: 20

  nats:
    image: nats:2.15-alpine
    ports:
      - "4222:4222"
      - "8222:8222"
    command: ["-js", "-sd", "/data", "-m", "8222"]
    volumes:
      - nats-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8222/healthz"]
      interval: 2s
      timeout: 5s
      retries: 20

  seaweedfs-master:
    image: chrislusf/seaweedfs:4.03
    command: master -ip=seaweedfs-master -ip.bind=0.0.0.0 -port=9333
    ports:
      - "9333:9333"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9333/cluster/status || exit 1"]
      interval: 2s
      timeout: 5s
      retries: 20

  seaweedfs-volume:
    image: chrislusf/seaweedfs:4.03
    command: volume -ip=seaweedfs-volume -ip.bind=0.0.0.0 -port=8080 -master=seaweedfs-master:9333 -dir=/data
    volumes:
      - seaweed-data:/data
    depends_on:
      seaweedfs-master:
        condition: service_healthy

  seaweedfs-filer:
    image: chrislusf/seaweedfs:4.03
    command: filer -ip=seaweedfs-filer -ip.bind=0.0.0.0 -port=8888 -master=seaweedfs-master:9333
    ports:
      - "8888:8888"
    depends_on:
      seaweedfs-master:
        condition: service_healthy
      seaweedfs-volume:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8888/ || exit 1"]
      interval: 2s
      timeout: 5s
      retries: 20

volumes:
  nats-data:
  seaweed-data:
