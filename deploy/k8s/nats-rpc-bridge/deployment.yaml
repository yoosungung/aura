# Shared NATS → Fission Router bridge (ARCHITECTURE §3.3 / §4.2 · M3.6).
# Queue-group aura-rpc-bridge; no Service; does not run domain handlers.
# Image must bake nats deps — no initContainer package install.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aura-nats-rpc-bridge
  namespace: aura
  labels:
    aura.runtime/class: sync
    aura.service: nats-rpc-bridge
    app.kubernetes.io/part-of: aura
    app.kubernetes.io/name: aura-nats-rpc-bridge
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: aura-nats-rpc-bridge
  template:
    metadata:
      labels:
        aura.runtime/class: sync
        aura.service: nats-rpc-bridge
        app.kubernetes.io/part-of: aura
        app.kubernetes.io/name: aura-nats-rpc-bridge
    spec:
      containers:
        - name: bridge
          image: aura/nats-rpc-bridge:local
          imagePullPolicy: IfNotPresent
          env:
            - name: NATS_URL
              value: nats://nats.aura.svc.cluster.local:4222
            # Fission 1.27: /fission-function/* is on router-internal :8889 (public :80 is HTTPTrigger only).
            - name: FISSION_ROUTER_URL
              value: http://router-internal.fission.svc:8889
            - name: RPC_QUEUE
              value: aura-rpc-bridge
            # Throughput: parallel dispatch + per-pod in-flight cap (HOL mitigation).
            - name: RPC_MAX_INFLIGHT
              value: "64"
            # Hang isolation: abort fetch before Function timeout (30s).
            - name: RPC_FETCH_TIMEOUT_MS
              value: "25000"
          resources:
            requests:
              cpu: 25m
              memory: 128Mi
            limits:
              memory: 512Mi
