# Shared NATS → Fission Router bridge (ARCHITECTURE §3.3 / §4.2).
# Queue-group aura-rpc-bridge; no Service; does not run domain handlers.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aura-nats-rpc-bridge
  namespace: default
  labels:
    aura.runtime/class: sync
    aura.service: nats-rpc-bridge
    app.kubernetes.io/part-of: aura
    app.kubernetes.io/name: aura-nats-rpc-bridge
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: aura-nats-rpc-bridge
  template:
    metadata:
      labels:
        aura.runtime/class: sync
        aura.service: nats-rpc-bridge
        app.kubernetes.io/part-of: aura
        app.kubernetes.io/name: aura-nats-rpc-bridge
    spec:
      initContainers:
        - name: npm-ci
          image: node:22-alpine
          imagePullPolicy: IfNotPresent
          workingDir: /app
          command: ["sh", "-c"]
          args:
            - |
              set -eu
              cp -a /src/. /app/
              npm install --omit=dev --no-audit --no-fund
          volumeMounts:
            - name: src
              mountPath: /src
              readOnly: true
            - name: app
              mountPath: /app
      containers:
        - name: bridge
          image: node:22-alpine
          imagePullPolicy: IfNotPresent
          workingDir: /app
          env:
            - name: NATS_URL
              value: nats://nats.aura.svc.cluster.local:4222
            # Fission 1.27: /fission-function/* is on router-internal :8889 (public :80 is HTTPTrigger only).
            - name: FISSION_ROUTER_URL
              value: http://router-internal.fission.svc:8889
            - name: RPC_QUEUE
              value: aura-rpc-bridge
          command: ["node"]
          args: ["bridge.js"]
          volumeMounts:
            - name: app
              mountPath: /app
          resources:
            requests:
              cpu: 25m
              memory: 128Mi
            limits:
              memory: 512Mi
      volumes:
        - name: src
          configMap:
            name: aura-nats-rpc-bridge-app
        - name: app
          emptyDir: {}
