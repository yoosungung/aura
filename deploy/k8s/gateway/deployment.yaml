# Gateway — always-on HA (ARCHITECTURE §2). Not Fission MQT / not scale-to-zero.
# Image: aura/gateway:local (deploy/scripts/build-gateway-images.sh).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aura-gateway
  namespace: aura
  labels:
    aura.runtime/class: gateway
    app.kubernetes.io/part-of: aura
    app.kubernetes.io/name: aura-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: aura-gateway
  template:
    metadata:
      labels:
        aura.runtime/class: gateway
        app.kubernetes.io/part-of: aura
        app.kubernetes.io/name: aura-gateway
    spec:
      containers:
        - name: gateway
          image: aura/gateway:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: NATS_URL
              value: nats://nats.aura.svc.cluster.local:4222
            - name: PORT
              value: "8080"
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 1
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 256Mi
