# Fission KEDA MQT — aura.tasks.memory.object_gc (ARCHITECTURE §3.2 · §8).
# minReplicaCount=0 → scale-to-zero when AURA_TASKS lag is idle.
apiVersion: fission.io/v1
kind: MessageQueueTrigger
metadata:
  name: aura-memory-object-gc
  namespace: default
  labels:
    aura.runtime/class: async
    aura.service: memory
    app.kubernetes.io/part-of: aura
    app.kubernetes.io/name: aura-memory-object-gc
spec:
  functionref:
    name: aura-memory-object-gc
    type: name
  messageQueueType: nats-jetstream
  mqtkind: keda
  topic: aura.tasks.memory.object_gc
  respTopic: aura.events.memory.object_gc.done
  errorTopic: aura.events.memory.object_gc.error
  maxRetries: 3
  contentType: application/json
  pollingInterval: 30
  cooldownPeriod: 300
  minReplicaCount: 0
  maxReplicaCount: 4
  metadata:
    stream: AURA_TASKS
    consumer: aura_memory_object_gc
    account: "$G"
    natsServer: nats://nats.aura.svc.cluster.local:4222
    natsServerMonitoringEndpoint: nats.aura.svc.cluster.local:8222
