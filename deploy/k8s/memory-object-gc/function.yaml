# Async object_gc Function — scale-to-zero owned by MessageQueueTrigger (ARCHITECTURE §4.1).
apiVersion: fission.io/v1
kind: Function
metadata:
  name: aura-memory-object-gc
  namespace: default
  labels:
    aura.runtime/class: async
    aura.service: memory
    app.kubernetes.io/part-of: aura
    app.kubernetes.io/name: aura-memory-object-gc
spec:
  environment:
    name: aura-memory-object-gc-nodejs
    namespace: default
  package:
    packageref:
      name: aura-memory-object-gc
      namespace: default
  InvokeStrategy:
    StrategyType: execution
    ExecutionStrategy:
      ExecutorType: poolmgr
  functionTimeout: 120
  idletimeout: 120
