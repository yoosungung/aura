# Sync memory recall Function — newdeploy Warm Pool (MinScale>=2).
# No MQT / no JetStream ScaledObject (ARCHITECTURE §4.2).
# Core RR body lives on Deployment aura-memory-recall-rr (§4.3).
apiVersion: fission.io/v1
kind: Function
metadata:
  name: aura-memory-recall
  namespace: default
  labels:
    aura.runtime/class: sync
    aura.service: memory
    app.kubernetes.io/part-of: aura
    app.kubernetes.io/name: aura-memory-recall
spec:
  environment:
    name: aura-memory-recall-nodejs
    namespace: default
  package:
    packageref:
      name: aura-memory-recall
      namespace: default
  InvokeStrategy:
    StrategyType: execution
    ExecutionStrategy:
      ExecutorType: newdeploy
      MinScale: 2
      MaxScale: 8
      SpecializationTimeout: 120
  functionTimeout: 30
  idletimeout: 0
