# Fission KEDA MQT — aura.tasks.compliance.erase (ARCHITECTURE §9.3).
# minReplicaCount=0 → scale-to-zero when AURA_TASKS lag is idle.
apiVersion: fission.io/v1
kind: MessageQueueTrigger
metadata:
  name: aura-compliance-erase
  namespace: default
  labels:
    aura.runtime/class: async
    aura.service: compliance
    app.kubernetes.io/part-of: aura
    app.kubernetes.io/name: aura-compliance-erase
spec:
  functionref:
    name: aura-compliance-erase
    type: name
  messageQueueType: nats-jetstream
  mqtkind: keda
  topic: aura.tasks.compliance.erase
  respTopic: aura.events.compliance.erase.done
  errorTopic: aura.events.compliance.erase.error
  maxRetries: 3
  contentType: application/json
  pollingInterval: 30
  cooldownPeriod: 300
  minReplicaCount: 0
  maxReplicaCount: 2
  metadata:
    stream: AURA_TASKS
    consumer: aura_compliance_erase
    account: "$G"
    natsServer: nats://nats.aura.svc.cluster.local:4222
    natsServerMonitoringEndpoint: nats.aura.svc.cluster.local:8222
