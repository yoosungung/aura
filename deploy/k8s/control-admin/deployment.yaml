# aura-control-admin — ops 관리 HTTP (ARCHITECTURE §2 · admin-ui-mvp.md).
# replicas ≥ 2 · ns aura · MQT 없음. Live Pooler/Garage = services/control injectable.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aura-control-admin
  namespace: aura
  labels:
    aura.runtime/class: control-admin
    app.kubernetes.io/part-of: aura
    app.kubernetes.io/name: aura-control-admin
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: aura-control-admin
  template:
    metadata:
      labels:
        aura.runtime/class: control-admin
        app.kubernetes.io/part-of: aura
        app.kubernetes.io/name: aura-control-admin
        app: aura-control-admin
    spec:
      containers:
        - name: control-admin
          image: node:22-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: AURA_CONTROL_ADMIN_MODE
              value: contract
            - name: AURA_ADMIN_TENANT_IDS
              value: ""
          command: ["node", "-e"]
          args:
            - |
              const http = require('http');
              const port = Number(process.env.PORT || 8080);
              http.createServer((req, res) => {
                const url = (req.url || '/').split('?')[0];
                if (url === '/healthz') {
                  res.writeHead(200, { 'content-type': 'application/json' });
                  res.end(JSON.stringify({ ok: true }));
                  return;
                }
                res.writeHead(503, { 'content-type': 'application/json' });
                res.end(JSON.stringify({
                  error: 'live_pooler_garage_wiring_pending',
                  hint: 'services/control/admin-http.js + deploy/docs/admin-ui-mvp.md',
                }));
              }).listen(port, () => console.log('aura-control-admin health on', port));
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 1
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 256Mi
