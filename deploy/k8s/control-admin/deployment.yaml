# aura-control-admin — ops 관리 HTTP (ARCHITECTURE §2 · admin-ui.md).
# replicas ≥ 2 · ns aura · MQT 없음. Pooler via aura-pg-dsn + aura-pg-app.
# App sources: ConfigMap aura-control-admin-app (applied by apply-admin-ui.sh).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aura-control-admin
  namespace: aura
  labels:
    aura.runtime/class: control-admin
    app.kubernetes.io/part-of: aura
    app.kubernetes.io/name: aura-control-admin
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: aura-control-admin
  template:
    metadata:
      labels:
        aura.runtime/class: control-admin
        app.kubernetes.io/part-of: aura
        app.kubernetes.io/name: aura-control-admin
        app: aura-control-admin
    spec:
      containers:
        - name: control-admin
          image: node:22-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: AURA_ADMIN_BEARER
              value: "ops-dev-token"
            - name: AURA_ADMIN_TENANT_IDS
              value: "11111111-1111-4111-8111-111111111111"
            - name: AURA_DATABASE_HOST
              valueFrom:
                configMapKeyRef:
                  name: aura-pg-dsn
                  key: AURA_DATABASE_HOST
            - name: AURA_DATABASE_PORT
              valueFrom:
                configMapKeyRef:
                  name: aura-pg-dsn
                  key: AURA_DATABASE_PORT
            - name: AURA_DATABASE_NAME
              valueFrom:
                configMapKeyRef:
                  name: aura-pg-dsn
                  key: AURA_DATABASE_NAME
            - name: AURA_DATABASE_USER
              valueFrom:
                configMapKeyRef:
                  name: aura-pg-dsn
                  key: AURA_DATABASE_USER
            - name: AURA_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: aura-pg-app
                  key: password
          command: ["sh", "-c"]
          args:
            - |
              set -e
              cp /config/*.js /app/
              cd /app
              npm init -y >/dev/null 2>&1
              npm install --omit=dev pg@8.13.1 >/dev/null 2>&1
              exec node admin-entrypoint.js
          volumeMounts:
            - name: app-config
              mountPath: /config
              readOnly: true
            - name: work
              mountPath: /app
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
      volumes:
        - name: app-config
          configMap:
            name: aura-control-admin-app
        - name: work
          emptyDir: {}
