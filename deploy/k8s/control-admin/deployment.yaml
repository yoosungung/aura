# aura-control-admin — ops 관리 HTTP (ARCHITECTURE §2 · admin-ui.md).
# replicas ≥ 2 · ns aura · MQT 없음. Pooler via aura-pg-dsn + aura-pg-app.
# Image: aura/control-admin:local (deploy/scripts/build-admin-images.sh).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aura-control-admin
  namespace: aura
  labels:
    aura.runtime/class: control-admin
    app.kubernetes.io/part-of: aura
    app.kubernetes.io/name: aura-control-admin
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: aura-control-admin
  template:
    metadata:
      labels:
        aura.runtime/class: control-admin
        app.kubernetes.io/part-of: aura
        app.kubernetes.io/name: aura-control-admin
        app: aura-control-admin
    spec:
      containers:
        - name: control-admin
          image: aura/control-admin:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: AURA_ADMIN_BEARER
              value: "ops-dev-token"
            - name: AURA_ADMIN_TENANT_IDS
              value: "11111111-1111-4111-8111-111111111111"
            - name: AURA_DATABASE_HOST
              valueFrom:
                configMapKeyRef:
                  name: aura-pg-dsn
                  key: AURA_DATABASE_HOST
            - name: AURA_DATABASE_PORT
              valueFrom:
                configMapKeyRef:
                  name: aura-pg-dsn
                  key: AURA_DATABASE_PORT
            - name: AURA_DATABASE_NAME
              valueFrom:
                configMapKeyRef:
                  name: aura-pg-dsn
                  key: AURA_DATABASE_NAME
            - name: AURA_DATABASE_USER
              valueFrom:
                configMapKeyRef:
                  name: aura-pg-dsn
                  key: AURA_DATABASE_USER
            - name: AURA_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: aura-pg-app
                  key: password
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
