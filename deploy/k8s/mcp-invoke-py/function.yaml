# Python mcp_invoke async Function — task-bridge only (no MQT). M3.6.
apiVersion: fission.io/v1
kind: Function
metadata:
  name: aura-mcp-invoke-py
  namespace: default
  labels:
    aura.runtime/class: async
    aura.runtime/lang: python
    aura.service: mcp-invoke
    app.kubernetes.io/part-of: aura
    app.kubernetes.io/name: aura-mcp-invoke-py
spec:
  environment:
    name: aura-python-async
    namespace: default
  package:
    packageref:
      name: aura-mcp-invoke-py
      namespace: default
  InvokeStrategy:
    StrategyType: execution
    ExecutionStrategy:
      ExecutorType: poolmgr
  functionTimeout: 60
  idletimeout: 120
