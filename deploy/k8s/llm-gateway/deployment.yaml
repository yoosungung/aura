# LLM Gateway — always-on HA (ARCHITECTURE §9.4). Sole Function→provider exit.
# Image: aura/llm-gateway:local (deploy/scripts/build-gateway-images.sh).
# Default provider = stub (live provider keys = Non-goal).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aura-llm-gateway
  namespace: aura
  labels:
    aura.runtime/class: llm-gateway
    app.kubernetes.io/part-of: aura
    app.kubernetes.io/name: aura-llm-gateway
    app: aura-llm-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: aura-llm-gateway
  template:
    metadata:
      labels:
        aura.runtime/class: llm-gateway
        app.kubernetes.io/part-of: aura
        app.kubernetes.io/name: aura-llm-gateway
        app: aura-llm-gateway
    spec:
      containers:
        - name: llm-gateway
          image: aura/llm-gateway:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 1
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 256Mi
