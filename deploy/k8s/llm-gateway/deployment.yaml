# LLM Gateway — always-on HA (ARCHITECTURE §9.4). Sole Function→provider exit.
# Image: aura/llm-gateway:local (deploy/scripts/build-gateway-images.sh).
# Provider catalog: ConfigMap aura-llm-gateway-providers (default ollama gemma4:e2b).
# Kinds: stub | ollama | openai | vllm | sglang. Keys via Secret env, not this file.
# HTTP: POST /v1/chat/completions · POST /v1/embeddings · GET /v1/billing/usage · GET /healthz
# Routing: model aura-auto + ConfigMap routing.tiers · optional X-Aura-Route-Pin.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aura-llm-gateway
  namespace: aura
  labels:
    aura.runtime/class: llm-gateway
    app.kubernetes.io/part-of: aura
    app.kubernetes.io/name: aura-llm-gateway
    app: aura-llm-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: aura-llm-gateway
  template:
    metadata:
      labels:
        aura.runtime/class: llm-gateway
        app.kubernetes.io/part-of: aura
        app.kubernetes.io/name: aura-llm-gateway
        app: aura-llm-gateway
    spec:
      containers:
        - name: llm-gateway
          image: aura/llm-gateway:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: AURA_LLM_PROVIDERS_FILE
              value: /etc/aura/llm-providers/providers.json
          volumeMounts:
            - name: llm-providers
              mountPath: /etc/aura/llm-providers
              readOnly: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 1
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 256Mi
      volumes:
        - name: llm-providers
          configMap:
            name: aura-llm-gateway-providers
