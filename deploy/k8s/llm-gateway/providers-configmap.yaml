# Provider catalog for aura-llm-gateway. API keys stay in Secret via apiKeyEnv.
# Kinds: stub | ollama | openai | vllm (:8000) | sglang (:30000).
# Lab default: host Ollama via OrbStack host.orb.internal (not in-cluster Service).
# Weights are not hosted by this pod.
apiVersion: v1
kind: ConfigMap
metadata:
  name: aura-llm-gateway-providers
  namespace: aura
  labels:
    app.kubernetes.io/part-of: aura
    app.kubernetes.io/name: aura-llm-gateway
data:
  providers.json: |
    {
      "providers": [
        {
          "name": "ollama",
          "kind": "ollama",
          "model": "gemma4:e2b-mlx",
          "baseUrl": "http://host.orb.internal:11434/v1"
        }
      ],
      "embeddings": {
        "name": "ollama-embed",
        "kind": "ollama",
        "model": "embeddinggemma-2:270m-mxfp8-text",
        "baseUrl": "http://host.orb.internal:11434/v1"
      },
      "routing": {
        "tiers": {
          "simple": "gemma4:e2b-mlx",
          "medium": "gemma4:e2b-mlx",
          "complex": "gemma4:e2b-mlx"
        }
      }
    }
