# Provider catalog for aura-llm-gateway. API keys stay in Secret via apiKeyEnv.
# Kinds: stub | ollama | openai | vllm (:8000) | sglang (:30000).
# Cluster default: ollama gemma4:e2b. Weights are not hosted by this pod.
apiVersion: v1
kind: ConfigMap
metadata:
  name: aura-llm-gateway-providers
  namespace: aura
  labels:
    app.kubernetes.io/part-of: aura
    app.kubernetes.io/name: aura-llm-gateway
data:
  providers.json: |
    {
      "providers": [
        {
          "name": "ollama",
          "kind": "ollama",
          "model": "gemma4:e2b",
          "baseUrl": "http://ollama.aura.svc.cluster.local:11434/v1"
        }
      ]
    }
