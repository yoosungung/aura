# Shared async Python Environment (poolmgr). agent/mcp python Functions (M3.6 · fastapi-env).
apiVersion: fission.io/v1
kind: Environment
metadata:
  name: aura-python-async
  namespace: default
  labels:
    aura.runtime/class: async
    aura.runtime/lang: python
    app.kubernetes.io/part-of: aura
    app.kubernetes.io/name: aura-python-async
spec:
  version: 3
  runtime:
    image: ghcr.io/fission/python-fastapi-env:1.35.0
  builder:
    image: ghcr.io/fission/python-fastapi-builder:1.35.0
  poolsize: 1
  resources: {}
