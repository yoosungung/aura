# Shared async Node Environment (poolmgr). One pool for all aura.tasks.* Functions.
apiVersion: fission.io/v1
kind: Environment
metadata:
  name: aura-nodejs-async
  namespace: default
  labels:
    aura.runtime/class: async
    app.kubernetes.io/part-of: aura
    app.kubernetes.io/name: aura-nodejs-async
spec:
  version: 3
  runtime:
    image: ghcr.io/fission/node-env:latest
  builder:
    image: ghcr.io/fission/node-builder:latest
  poolsize: 1
  resources: {}
