# Shared sync Node Environment — poolmgr Warm (ARCHITECTURE §4.2).
# poolsize ≥ 2; NATS subscription is aura-nats-rpc-bridge (not per-service *-rr).
apiVersion: fission.io/v1
kind: Environment
metadata:
  name: aura-nodejs-sync
  namespace: default
  labels:
    aura.runtime/class: sync
    app.kubernetes.io/part-of: aura
    app.kubernetes.io/name: aura-nodejs-sync
spec:
  version: 3
  runtime:
    image: ghcr.io/fission/node-env:latest
  builder:
    image: ghcr.io/fission/node-builder:latest
  poolsize: 2
  resources: {}
