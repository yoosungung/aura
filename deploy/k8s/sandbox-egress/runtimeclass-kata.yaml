# High-risk sandbox RuntimeClass — ARCHITECTURE §9.1 · high-risk-tenant-nodepool.
# Pins scheduling to the dedicated Kata node pool (label + taint).
# Cluster must install Kata handler; name may be remapped in DESIGN when pinned.
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: kata
  labels:
    app.kubernetes.io/part-of: aura
    aura.sandbox/tier: high-risk
handler: kata-qemu
scheduling:
  nodeSelector:
    aura.sandbox/pool: kata
  tolerations:
    - key: aura.sandbox/pool
      operator: Equal
      value: kata
      effect: NoSchedule
