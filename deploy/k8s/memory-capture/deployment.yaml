# memory-capture JetStream Deployment — inline extract→embed→store.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aura-memory-capture
  namespace: aura
  labels:
    aura.runtime/class: async
    aura.service: memory-capture
    app.kubernetes.io/part-of: aura
    app.kubernetes.io/name: aura-memory-capture
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: aura-memory-capture
  template:
    metadata:
      labels:
        aura.runtime/class: async
        aura.service: memory-capture
        app.kubernetes.io/part-of: aura
        app.kubernetes.io/name: aura-memory-capture
    spec:
      containers:
        - name: worker
          image: aura/memory-capture:local
          imagePullPolicy: IfNotPresent
          env:
            - name: NATS_URL
              value: nats://nats.aura.svc.cluster.local:4222
            - name: STREAM
              value: AURA_TASKS
            - name: TASK_SUBJECT
              value: aura.tasks.memory.capture
            - name: DURABLE
              value: aura_memory_capture
            - name: RESP_TOPIC
              value: aura.events.memory.capture.done
            - name: ERROR_TOPIC
              value: aura.events.memory.capture.error
            - name: AURA_LLM_GATEWAY_URL
              value: http://aura-llm-gateway.aura.svc.cluster.local:8080
            - name: AURA_DATABASE_HOST
              valueFrom:
                configMapKeyRef:
                  name: aura-pg-dsn
                  key: AURA_DATABASE_HOST
                  optional: true
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 512Mi
