# Sync control resolve Function — poolmgr via aura-nodejs-sync (ARCHITECTURE §4.2).
# NATS Core RR is aura-nats-rpc-bridge → Fission Router (no *-rr Deployment).
apiVersion: fission.io/v1
kind: Function
metadata:
  name: aura-control-resolve
  namespace: default
  labels:
    aura.runtime/class: sync
    aura.service: control
    app.kubernetes.io/part-of: aura
    app.kubernetes.io/name: aura-control-resolve
spec:
  environment:
    name: aura-nodejs-sync
    namespace: default
  package:
    packageref:
      name: aura-control-resolve
      namespace: default
  InvokeStrategy:
    StrategyType: execution
    ExecutionStrategy:
      ExecutorType: poolmgr
  functionTimeout: 30
