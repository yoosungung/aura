# Async embed Function — scale-to-zero owned by MessageQueueTrigger (ARCHITECTURE §4.1).
# Lab pin via ConfigMap aura-memory-embed-lab (Fission has no Function.spec.env).
apiVersion: fission.io/v1
kind: Function
metadata:
  name: aura-memory-embed
  namespace: default
  labels:
    aura.runtime/class: async
    aura.service: memory
    app.kubernetes.io/part-of: aura
    app.kubernetes.io/name: aura-memory-embed
spec:
  environment:
    name: aura-nodejs-async
    namespace: default
  package:
    packageref:
      name: aura-memory-embed
      namespace: default
  configmaps:
    - name: aura-memory-embed-lab
      namespace: default
  InvokeStrategy:
    StrategyType: execution
    ExecutionStrategy:
      ExecutorType: poolmgr
  functionTimeout: 60
  idletimeout: 120
