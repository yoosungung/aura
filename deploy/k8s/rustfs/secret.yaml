# Lab placeholders. Replace before any shared cluster apply. Real keys stay out of git.
# rustfs-root is created by bootstrap.sh (not a kustomize resource).
# aura-object-store-creds is also upserted by bootstrap (same keys for lab root=app).
apiVersion: v1
kind: Secret
metadata:
  name: aura-object-store-creds
  namespace: aura
  labels:
    app.kubernetes.io/part-of: aura
    app.kubernetes.io/name: rustfs
type: Opaque
stringData:
  ACCESS_KEY_ID: replace-before-apply
  ACCESS_SECRET_KEY: replace-before-apply
