# M3.5: archive + node-builder (literal retired). Build: deploy/scripts/build-agent-invoke-archive.sh
apiVersion: fission.io/v1
kind: Package
metadata:
  name: aura-agent-invoke
  namespace: default
  labels:
    aura.runtime/class: async
    aura.service: agent-invoke
    app.kubernetes.io/part-of: aura
    app.kubernetes.io/name: aura-agent-invoke
  annotations:
    aura.package/build: deploy/scripts/build-agent-invoke-archive.sh
    aura.package/archive: deploy/k8s/agent-invoke/archive.zip
spec:
  environment:
    name: aura-nodejs-async
    namespace: default
  source:
    type: archive
    archive:
      type: url
      # Replace at apply with cluster-reachable URL or `fission package create --sourcearchive`.
      url: file:///fission-archives/aura-agent-invoke.zip
  deployment:
    type: archive
