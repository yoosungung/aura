# Node env for agent_invoke MQT (ARCHITECTURE §4.1). No PG/Pooler env.
apiVersion: fission.io/v1
kind: Environment
metadata:
  name: aura-agent-invoke-nodejs
  namespace: default
  labels:
    aura.runtime/class: async
    aura.service: agent-invoke
    app.kubernetes.io/part-of: aura
    app.kubernetes.io/name: aura-agent-invoke
spec:
  version: 3
  runtime:
    image: ghcr.io/fission/node-env:latest
  builder:
    image: ghcr.io/fission/node-builder:latest
  poolsize: 1
  resources: {}
