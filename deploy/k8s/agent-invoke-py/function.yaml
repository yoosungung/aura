# Python agent_invoke Function — routed by task-bridge (no MQT). M3.6 · fastapi-env.
apiVersion: fission.io/v1
kind: Function
metadata:
  name: aura-agent-invoke-py
  namespace: default
  labels:
    aura.runtime/class: async
    aura.runtime/lang: python
    aura.service: agent-invoke
    app.kubernetes.io/part-of: aura
    app.kubernetes.io/name: aura-agent-invoke-py
spec:
  environment:
    name: aura-python-async
    namespace: default
  package:
    functionName: handler.main
    packageref:
      name: aura-agent-invoke-py
      namespace: default
  InvokeStrategy:
    StrategyType: execution
    ExecutionStrategy:
      ExecutorType: poolmgr
  secrets:
    - name: aura-object-store-creds
      namespace: aura
  configmaps:
    - name: aura-s3
      namespace: aura
  functionTimeout: 120
  idletimeout: 120
  concurrency: 4
