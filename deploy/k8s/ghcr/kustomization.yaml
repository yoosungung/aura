apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
images:
  - name: aura/svc-core
    newName: ghcr.io/yoosungung/aura/svc-core
    newTag: current
  - name: aura/ingestion-worker
    newName: ghcr.io/yoosungung/aura/ingestion-worker
    newTag: current
  - name: aura/gateway-web
    newName: ghcr.io/yoosungung/aura/gateway-web
    newTag: current
  - name: aura/gateway-email
    newName: ghcr.io/yoosungung/aura/gateway-email
    newTag: current
  - name: aura/gateway-kakao
    newName: ghcr.io/yoosungung/aura/gateway-kakao
    newTag: current
  - name: aura/svc-sla-routing
    newName: ghcr.io/yoosungung/aura/svc-sla-routing
    newTag: current
  - name: aura/svc-automation
    newName: ghcr.io/yoosungung/aura/svc-automation
    newTag: current
  - name: aura/event-archive
    newName: ghcr.io/yoosungung/aura/event-archive
    newTag: current
  - name: aura/seed
    newName: ghcr.io/yoosungung/aura/seed
    newTag: current
  - name: aura/svc-ai-agent
    newName: ghcr.io/yoosungung/aura/svc-ai-agent
    newTag: current
  - name: aura/frontend
    newName: ghcr.io/yoosungung/aura/frontend
    newTag: current
patches:
  - target:
      kind: Deployment
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always
  - target:
      kind: Job
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always
