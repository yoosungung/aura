apiVersion: v1
kind: ConfigMap
metadata:
  name: aura-s3
  namespace: aura
  labels:
    app.kubernetes.io/part-of: aura
    app.kubernetes.io/name: garage
data:
  AURA_S3_ENDPOINT: http://garage.aura.svc.cluster.local:3900
  AURA_S3_REGION: garage
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: garage-config
  namespace: aura
  labels:
    app.kubernetes.io/part-of: aura
    app.kubernetes.io/name: garage
data:
  garage.toml: |
    metadata_dir = "/var/lib/garage/meta"
    data_dir = "/var/lib/garage/data"
    db_engine = "sqlite"
    replication_factor = 1
    rpc_bind_addr = "[::]:3901"
    rpc_public_addr = "127.0.0.1:3901"
    rpc_secret = "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
    [s3_api]
    s3_region = "garage"
    api_bind_addr = "[::]:3900"
    root_domain = ".s3.garage.localhost"
    [admin]
    api_bind_addr = "[::]:3903"
    admin_token = "replace-before-apply"
