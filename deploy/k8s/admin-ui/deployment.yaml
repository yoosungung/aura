# Admin UI SPA — static nginx · proxies /v1 → aura-control-admin (ARCHITECTURE §2).
# dist + nginx.conf applied as ConfigMaps by apply-admin-ui.sh.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aura-admin-ui
  namespace: aura
  labels:
    aura.runtime/class: admin-ui
    app.kubernetes.io/part-of: aura
    app.kubernetes.io/name: aura-admin-ui
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: aura-admin-ui
  template:
    metadata:
      labels:
        aura.runtime/class: admin-ui
        app.kubernetes.io/part-of: aura
        app.kubernetes.io/name: aura-admin-ui
        app: aura-admin-ui
    spec:
      containers:
        - name: admin-ui
          image: nginx:1.27-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
              readOnly: true
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 1
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              memory: 128Mi
      volumes:
        - name: html
          configMap:
            name: aura-admin-ui-dist
        - name: nginx-conf
          configMap:
            name: aura-admin-ui-nginx
            items:
              - key: default.conf
                path: default.conf
