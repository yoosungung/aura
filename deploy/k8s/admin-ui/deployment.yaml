# Admin UI SPA — image bakes dist + nginx.conf (ARCHITECTURE §2).
# /v1 proxies to aura-control-admin. Build: deploy/scripts/build-admin-images.sh.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aura-admin-ui
  namespace: aura
  labels:
    aura.runtime/class: admin-ui
    app.kubernetes.io/part-of: aura
    app.kubernetes.io/name: aura-admin-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: aura-admin-ui
  template:
    metadata:
      labels:
        aura.runtime/class: admin-ui
        app.kubernetes.io/part-of: aura
        app.kubernetes.io/name: aura-admin-ui
        app: aura-admin-ui
    spec:
      containers:
        - name: admin-ui
          image: aura/admin-ui:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 1
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              memory: 128Mi
