# Async smoke Function — scale-to-zero is on the MessageQueueTrigger, not MinScale here.
# Package body (echo): follow-up; packageref name reserved as aura-tasks-smoke.
apiVersion: fission.io/v1
kind: Function
metadata:
  name: aura-tasks-smoke
  namespace: default
  labels:
    aura.runtime/class: async
    app.kubernetes.io/part-of: aura
    app.kubernetes.io/name: aura-tasks-smoke
spec:
  environment:
    name: aura-async-nodejs
    namespace: default
  package:
    packageref:
      name: aura-tasks-smoke
      namespace: default
  # poolmgr is fine for MQT; do NOT set MinScale>=2 on this Function.
  InvokeStrategy:
    StrategyType: execution
    ExecutionStrategy:
      ExecutorType: poolmgr
  functionTimeout: 60
  idletimeout: 120
