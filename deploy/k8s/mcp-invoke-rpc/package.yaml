# M3.5: Warm Function package shares mcp-invoke archive (handler entry).
apiVersion: fission.io/v1
kind: Package
metadata:
  name: aura-mcp-invoke-rpc
  namespace: default
  labels:
    aura.runtime/class: sync
    aura.service: mcp-invoke
    app.kubernetes.io/part-of: aura
    app.kubernetes.io/name: aura-mcp-invoke-rpc
  annotations:
    aura.package/build: deploy/scripts/build-mcp-invoke-archive.sh
    aura.package/archive: deploy/k8s/mcp-invoke-rpc/archive.zip
spec:
  environment:
    name: aura-mcp-invoke-rpc-nodejs
    namespace: default
  source:
    type: archive
    archive:
      type: url
      url: file:///fission-archives/aura-mcp-invoke.zip
  deployment:
    type: archive
