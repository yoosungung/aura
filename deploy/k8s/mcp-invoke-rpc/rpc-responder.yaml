# Core Request-Reply responder for aura.rpc.mcp.tool (ARCHITECTURE §3.3 / §4.2 / §4.3).
# Explicit Deployment (replicas>=2) — stock Fission node-env does not NATS-subscribe on boot.
# Queue-group HA; no MessageQueueTrigger / JetStream lag scaler.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aura-mcp-invoke-rr
  namespace: default
  labels:
    aura.runtime/class: sync
    aura.service: mcp-invoke
    app.kubernetes.io/part-of: aura
    app.kubernetes.io/name: aura-mcp-invoke-rr
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: aura-mcp-invoke-rr
  template:
    metadata:
      labels:
        aura.runtime/class: sync
        aura.service: mcp-invoke
        app.kubernetes.io/part-of: aura
        app.kubernetes.io/name: aura-mcp-invoke-rr
    spec:
      containers:
        - name: reply
          image: natsio/nats-box:0.19.0
          imagePullPolicy: IfNotPresent
          env:
            - name: NATS_URL
              value: nats://nats.aura.svc.cluster.local:4222
            - name: RPC_SUBJECT
              value: aura.rpc.mcp.tool
            - name: RPC_QUEUE
              value: aura-mcp-invoke
          command: ["sh", "-c"]
          args:
            - |
              set -eu
              echo "subscribing subject=$RPC_SUBJECT queue=$RPC_QUEUE nats=$NATS_URL"
              # Stub body matches services/mcp-invoke handler RPC contract (mode=stub).
              exec nats reply -s "$NATS_URL" -q "$RPC_QUEUE" "$RPC_SUBJECT" \
                '{"type":"mcp.tool.done","ok":true,"subject":"aura.rpc.mcp.tool","deploy_class":"sync","mode":"stub","result":{"echo":{{Request}}},"echo":{{Request}}}'
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi