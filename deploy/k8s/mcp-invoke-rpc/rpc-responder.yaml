# Core Request-Reply responder for aura.rpc.mcp.tool (ARCHITECTURE §3.3 / §4.2).
# M3.5: Node queue-group worker (nats-box stub retired).
# Apply: ConfigMap aura-mcp-invoke-rr-app from archive.zip (see apply-product.sh).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aura-mcp-invoke-rr
  namespace: default
  labels:
    aura.runtime/class: sync
    aura.service: mcp-invoke
    app.kubernetes.io/part-of: aura
    app.kubernetes.io/name: aura-mcp-invoke-rr
  annotations:
    aura.rpc/reply-type: mcp.tool.done
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: aura-mcp-invoke-rr
  template:
    metadata:
      labels:
        aura.runtime/class: sync
        aura.service: mcp-invoke
        app.kubernetes.io/part-of: aura
        app.kubernetes.io/name: aura-mcp-invoke-rr
    spec:
      initContainers:
        - name: npm-ci
          image: node:22-alpine
          imagePullPolicy: IfNotPresent
          workingDir: /app
          command: ["sh", "-c"]
          args:
            - |
              set -eu
              cp -a /src/. /app/
              npm install --omit=dev --no-audit --no-fund
          volumeMounts:
            - name: src
              mountPath: /src
              readOnly: true
            - name: app
              mountPath: /app
      containers:
        - name: reply
          image: node:22-alpine
          imagePullPolicy: IfNotPresent
          workingDir: /app
          env:
            - name: NATS_URL
              value: nats://nats.aura.svc.cluster.local:4222
            - name: RPC_SUBJECT
              value: aura.rpc.mcp.tool
            - name: RPC_QUEUE
              value: aura-mcp-invoke
          command: ["node"]
          args: ["rpc-worker.js"]
          volumeMounts:
            - name: app
              mountPath: /app
          resources:
            requests:
              cpu: 25m
              memory: 128Mi
            limits:
              memory: 512Mi
      volumes:
        - name: src
          configMap:
            name: aura-mcp-invoke-rr-app
        - name: app
          emptyDir: {}
