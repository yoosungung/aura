# Core Request-Reply responder for aura.rpc.mcp.tool (ARCHITECTURE §3.3 / §4.2).
# M3.5: Node queue-group worker (nats-box stub retired).
# Reply body contract: type mcp.tool.done | mcp.tool.error (see services/mcp-invoke/handler.js).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aura-mcp-invoke-rr
  namespace: default
  labels:
    aura.runtime/class: sync
    aura.service: mcp-invoke
    app.kubernetes.io/part-of: aura
    app.kubernetes.io/name: aura-mcp-invoke-rr
  annotations:
    aura.rpc/reply-type: mcp.tool.done
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: aura-mcp-invoke-rr
  template:
    metadata:
      labels:
        aura.runtime/class: sync
        aura.service: mcp-invoke
        app.kubernetes.io/part-of: aura
        app.kubernetes.io/name: aura-mcp-invoke-rr
    spec:
      containers:
        - name: reply
          image: node:22-alpine
          imagePullPolicy: IfNotPresent
          workingDir: /app
          env:
            - name: NATS_URL
              value: nats://nats.aura.svc.cluster.local:4222
            - name: RPC_SUBJECT
              value: aura.rpc.mcp.tool
            - name: RPC_QUEUE
              value: aura-mcp-invoke
          command: ["node"]
          args: ["rpc-worker.js"]
          volumeMounts:
            - name: app
              mountPath: /app
          resources:
            requests:
              cpu: 25m
              memory: 128Mi
            limits:
              memory: 512Mi
      volumes:
        - name: app
          emptyDir: {}
      # Production: replace emptyDir with image baked from services/mcp-invoke archive
      # (CI copies handler.js factory.js streamable-http.js rpc-worker.js package.json + npm ci).
---
# Note: apply pipeline should populate /app from deploy/k8s/mcp-invoke-rpc/archive.zip
# or a dedicated container image. Static gate checks Node + queue-group + mcp.tool.done contract
# via services/mcp-invoke/rpc-worker.js source (not nats-box).
