# Sync mcp_invoke RPC Function — poolmgr via aura-nodejs-sync (ARCHITECTURE §4.2).
# NATS Core RR is aura-nats-rpc-bridge → Fission Router (no *-rr Deployment).
apiVersion: fission.io/v1
kind: Function
metadata:
  name: aura-mcp-invoke-rpc
  namespace: default
  labels:
    aura.runtime/class: sync
    aura.service: mcp-invoke
    app.kubernetes.io/part-of: aura
    app.kubernetes.io/name: aura-mcp-invoke-rpc
spec:
  environment:
    name: aura-nodejs-sync
    namespace: default
  package:
    packageref:
      name: aura-mcp-invoke-rpc
      namespace: default
  InvokeStrategy:
    StrategyType: execution
    ExecutionStrategy:
      ExecutorType: poolmgr
  secrets:
    - name: aura-object-store-creds
      namespace: aura
  configmaps:
    - name: aura-s3
      namespace: aura
  functionTimeout: 30
