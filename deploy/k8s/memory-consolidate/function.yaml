# Async consolidate Function — scale-to-zero owned by MessageQueueTrigger (ARCHITECTURE §4.1).
apiVersion: fission.io/v1
kind: Function
metadata:
  name: aura-memory-consolidate
  namespace: default
  labels:
    aura.runtime/class: async
    aura.service: memory
    app.kubernetes.io/part-of: aura
    app.kubernetes.io/name: aura-memory-consolidate
spec:
  environment:
    name: aura-nodejs-async
    namespace: default
  package:
    packageref:
      name: aura-memory-consolidate
      namespace: default
  InvokeStrategy:
    StrategyType: execution
    ExecutionStrategy:
      ExecutorType: poolmgr
  functionTimeout: 60
  idletimeout: 120
