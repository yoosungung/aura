# CronJob runs consolidate handler once daily UTC — no always-on Deployment.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: aura-memory-consolidate-cron
  namespace: aura
  labels:
    aura.runtime/class: batch-cron
    aura.service: memory
    app.kubernetes.io/part-of: aura
    app.kubernetes.io/name: aura-memory-consolidate-cron
spec:
  schedule: "0 0 * * *"
  timeZone: "UTC"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 600
      backoffLimit: 1
      template:
        metadata:
          labels:
            app.kubernetes.io/name: aura-memory-consolidate-cron
        spec:
          restartPolicy: OnFailure
          containers:
            - name: consolidate
              image: aura/memory-batch:local
              imagePullPolicy: IfNotPresent
              command: ["/aura-memory-consolidate"]
              env:
                - name: AURA_DATABASE_HOST
                  valueFrom:
                    configMapKeyRef:
                      name: aura-pg-dsn
                      key: AURA_DATABASE_HOST
                      optional: true
