# Fission KEDA MQT — aura.tasks.memory.store (ARCHITECTURE §3.2 · §4.1).
# minReplicaCount=0 → scale-to-zero when AURA_TASKS lag is idle.
apiVersion: fission.io/v1
kind: MessageQueueTrigger
metadata:
  name: aura-memory-store
  namespace: default
  labels:
    aura.runtime/class: async
    aura.service: memory
    app.kubernetes.io/part-of: aura
    app.kubernetes.io/name: aura-memory-store
spec:
  functionref:
    name: aura-memory-store
    type: name
  messageQueueType: nats-jetstream
  mqtkind: keda
  topic: aura.tasks.memory.store
  respTopic: aura.events.memory.stored
  errorTopic: aura.events.memory.store.error
  maxRetries: 3
  contentType: application/json
  pollingInterval: 30
  cooldownPeriod: 300
  minReplicaCount: 0
  maxReplicaCount: 8
  metadata:
    stream: AURA_TASKS
    consumer: aura_memory_store
    account: "$G"
    natsServer: nats://nats.aura.svc.cluster.local:4222
    natsServerMonitoringEndpoint: nats.aura.svc.cluster.local:8222
