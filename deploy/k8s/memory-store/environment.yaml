# Node env for svc-memory store MQT (ARCHITECTURE §4.1). May share image with async-smoke.
apiVersion: fission.io/v1
kind: Environment
metadata:
  name: aura-memory-store-nodejs
  namespace: default
  labels:
    aura.runtime/class: async
    aura.service: memory
    app.kubernetes.io/part-of: aura
    app.kubernetes.io/name: aura-memory-store
spec:
  version: 3
  runtime:
    image: ghcr.io/fission/node-env:latest
  builder:
    image: ghcr.io/fission/node-builder:latest
  poolsize: 1
  resources: {}
