apiVersion: batch/v1
kind: Job
metadata:
  name: seed
spec:
  backoffLimit: 8
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-postgres
          image: pgvector/pgvector:0.8.7-pg16
          command: ["sh", "-c", "until pg_isready -h postgres -U aura -d aura; do sleep 1; done"]
      containers:
        - name: seed
          image: aura/seed:main
          envFrom:
            - configMapRef:
                name: aura-config
