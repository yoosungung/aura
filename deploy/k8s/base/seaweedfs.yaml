apiVersion: v1
kind: Service
metadata:
  name: seaweedfs-master
spec:
  selector:
    app: seaweedfs-master
  ports:
    - name: http
      port: 9333
      targetPort: 9333
    - name: grpc
      port: 19333
      targetPort: 19333
---
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs-volume
spec:
  selector:
    app: seaweedfs-volume
  ports:
    - name: http
      port: 8080
      targetPort: 8080
    - name: grpc
      port: 18080
      targetPort: 18080
---
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs-filer
spec:
  type: NodePort
  selector:
    app: seaweedfs-filer
  ports:
    - name: http
      port: 8888
      targetPort: 8888
      nodePort: 30888
    - name: grpc
      port: 18888
      targetPort: 18888
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: seaweedfs-master
spec:
  serviceName: seaweedfs-master
  replicas: 1
  selector:
    matchLabels:
      app: seaweedfs-master
  template:
    metadata:
      labels:
        app: seaweedfs-master
    spec:
      containers:
        - name: seaweedfs-master
          image: chrislusf/seaweedfs:4.03
          command: ["weed"]
          args: ["master", "-ip=seaweedfs-master", "-ip.bind=0.0.0.0", "-port=9333"]
          ports:
            - containerPort: 9333
          readinessProbe:
            exec:
              command: ["wget", "-qO-", "http://127.0.0.1:9333/cluster/status"]
            initialDelaySeconds: 2
            periodSeconds: 2
            timeoutSeconds: 5
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: seaweedfs-volume
spec:
  serviceName: seaweedfs-volume
  replicas: 1
  selector:
    matchLabels:
      app: seaweedfs-volume
  template:
    metadata:
      labels:
        app: seaweedfs-volume
    spec:
      containers:
        - name: seaweedfs-volume
          image: chrislusf/seaweedfs:4.03
          command: ["weed"]
          args:
            - volume
            - -ip=seaweedfs-volume
            - -ip.bind=0.0.0.0
            - -port=8080
            - -master=seaweedfs-master:9333
            - -dir=/data
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: seaweedfs-filer
spec:
  serviceName: seaweedfs-filer
  replicas: 1
  selector:
    matchLabels:
      app: seaweedfs-filer
  template:
    metadata:
      labels:
        app: seaweedfs-filer
    spec:
      containers:
        - name: seaweedfs-filer
          image: chrislusf/seaweedfs:4.03
          command: ["weed"]
          args:
            - filer
            - -ip=seaweedfs-filer
            - -ip.bind=0.0.0.0
            - -port=8888
            - -master=seaweedfs-master:9333
          ports:
            - containerPort: 8888
          readinessProbe:
            exec:
              command: ["wget", "-qO-", "http://127.0.0.1:8888/"]
            initialDelaySeconds: 2
            periodSeconds: 2
            timeoutSeconds: 5
