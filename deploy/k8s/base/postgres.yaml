apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  type: NodePort
  selector:
    app: postgres
  ports:
    - name: pg
      port: 5432
      targetPort: 5432
      nodePort: 30432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      securityContext:
        fsGroup: 999
      initContainers:
        - name: data-perms
          image: pgvector/pgvector:0.8.7-pg16
          command: ["sh", "-c", "chown 999:999 /var/lib/postgresql/data"]
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      containers:
        - name: postgres
          image: pgvector/pgvector:0.8.7-pg16
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: aura
            - name: POSTGRES_PASSWORD
              value: aura
            - name: POSTGRES_DB
              value: aura
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "aura", "-d", "aura"]
            initialDelaySeconds: 3
            periodSeconds: 2
            timeoutSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
