apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-email
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway-email
  template:
    metadata:
      labels:
        app: gateway-email
    spec:
      containers:
        - name: gateway-email
          image: aura/gateway-email:main
          ports:
            - containerPort: 25
          envFrom:
            - configMapRef:
                name: aura-config
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-email
spec:
  selector:
    app: gateway-email
  ports:
    - name: smtp
      port: 25
      targetPort: 25
