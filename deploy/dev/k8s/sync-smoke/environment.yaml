# Warm Node env for sync RPC smoke Function (ARCHITECTURE §4.2).
# Core RR subscribe: see rpc-responder.yaml (nats reply queue-group).
apiVersion: fission.io/v1
kind: Environment
metadata:
  name: aura-sync-nodejs
  namespace: default
  labels:
    aura.runtime/class: sync
    app.kubernetes.io/part-of: aura
spec:
  version: 3
  runtime:
    image: ghcr.io/fission/node-env:latest
  builder:
    image: ghcr.io/fission/node-builder:latest
  # Warm pool for newdeploy specialize; keep ≥1 builder-side spare optional.
  poolsize: 2
  resources: {}
