# Sync smoke Function — newdeploy Warm Pool (MinScale>=2). No MQT / no JetStream ScaledObject.
# Core RR body lives on Deployment aura-rpc-smoke-rr (ARCHITECTURE §4.3) — stock node-env
# does not NATS-subscribe on boot; this Function keeps the Warm Pool invariant for V0.1.
apiVersion: fission.io/v1
kind: Function
metadata:
  name: aura-rpc-smoke
  namespace: default
  labels:
    aura.runtime/class: sync
    app.kubernetes.io/part-of: aura
    app.kubernetes.io/name: aura-rpc-smoke
spec:
  environment:
    name: aura-sync-nodejs
    namespace: default
  package:
    packageref:
      name: aura-rpc-smoke
      namespace: default
  InvokeStrategy:
    StrategyType: execution
    ExecutionStrategy:
      ExecutorType: newdeploy
      MinScale: 2
      MaxScale: 4
      SpecializationTimeout: 120
  functionTimeout: 30
  idletimeout: 0
