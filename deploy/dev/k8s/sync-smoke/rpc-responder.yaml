# Core Request-Reply responder for aura.rpc.smoke (ARCHITECTURE §4.2 / §4.3).
# Explicit Deployment (replicas>=2) — stock Fission node-env does not NATS-subscribe on boot.
# Queue-group HA; no MessageQueueTrigger / JetStream lag scaler.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aura-rpc-smoke-rr
  namespace: default
  labels:
    aura.runtime/class: sync
    app.kubernetes.io/part-of: aura
    app.kubernetes.io/name: aura-rpc-smoke-rr
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: aura-rpc-smoke-rr
  template:
    metadata:
      labels:
        aura.runtime/class: sync
        app.kubernetes.io/part-of: aura
        app.kubernetes.io/name: aura-rpc-smoke-rr
    spec:
      containers:
        - name: reply
          image: natsio/nats-box:0.19.0
          imagePullPolicy: IfNotPresent
          env:
            - name: NATS_URL
              value: nats://nats.aura.svc.cluster.local:4222
            - name: RPC_SUBJECT
              value: aura.rpc.smoke
            - name: RPC_QUEUE
              value: aura-rpc-smoke
          command: ["sh", "-c"]
          args:
            - |
              set -eu
              echo "subscribing subject=$RPC_SUBJECT queue=$RPC_QUEUE nats=$NATS_URL"
              exec nats reply -s "$NATS_URL" -q "$RPC_QUEUE" "$RPC_SUBJECT" \
                '{"type":"rpc.smoke.done","echo":{{Request}}}'
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
