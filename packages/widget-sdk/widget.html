<!doctype html>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; connect-src 'self' ws: wss:; img-src 'none'; font-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'self'" />
<meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content" />
<title>Aura</title>
<style>
  :root {
    --background: #f8fafc;
    --surface: #ffffff;
    --foreground: #0f172a;
    --border: #e2e8f0;
    --primary: #18181b;
    --muted: #64748b;
    --danger: #e11d48;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body {
    display: flex;
    flex-direction: column;
    background: var(--background);
    color: var(--foreground);
    font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Inter", system-ui, sans-serif;
  }
  header {
    display: flex;
    flex-shrink: 0;
    align-items: center;
    justify-content: space-between;
    height: 56px;
    padding: 0 16px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
  }
  .brand { display: flex; flex-direction: column; gap: 2px; }
  .brand strong { font-size: 14px; font-weight: 600; }
  .brand p { margin: 0; font-size: 11px; font-weight: 500; color: var(--muted); }
  header .actions { display: flex; gap: 4px; }
  header button { border: 0; background: transparent; font-size: 16px; cursor: pointer; color: var(--foreground); }
  #help-panel {
    flex-shrink: 0;
    padding: 8px 12px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
  }
  #help-panel[hidden] { display: none; }
  #help-search { display: flex; }
  #help-search input {
    width: 100%;
    height: 36px;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0 10px;
    font: inherit;
  }
  #help-results { margin: 8px 0 0; padding: 0; list-style: none; }
  #help-results li { padding: 6px 0; font-size: 13px; }
  #messages {
    flex: 1;
    min-height: 0;
    margin: 0;
    padding: 16px;
    overflow: auto;
    list-style: none;
  }
  #messages li {
    width: fit-content;
    max-width: 80%;
    margin: 8px 0;
    padding: 10px 14px;
    border-radius: 16px 16px 16px 4px;
    background: var(--surface);
    border: 1px solid var(--border);
    font-size: 14px;
    line-height: 1.6;
    white-space: pre-wrap;
    word-break: break-word;
  }
  #messages li .who {
    display: block;
    margin-bottom: 4px;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: -0.02em;
    color: var(--muted);
  }
  #messages li p { margin: 0; }
  #messages li[data-sender="User"] { margin-right: auto; }
  #messages li[data-sender="Contact"] .who { color: #a1a1aa; }
  #messages li[data-sender="Contact"] {
    margin-left: auto;
    background: var(--primary);
    color: #fafafa;
    border-color: var(--primary);
    border-radius: 16px 16px 4px 16px;
  }
  #messages li.csat,
  #messages li[data-csat="true"] {
    width: 100%;
    max-width: 100%;
    margin: 12px 0;
    padding: 12px;
    background: var(--surface);
    color: var(--foreground);
    border: 1px solid var(--border);
    border-radius: 12px;
  }
  #messages li.csat p,
  #messages li[data-csat="true"] p { margin: 0 0 8px; font-size: 13px; font-weight: 600; }
  #messages li.csat button,
  #messages li[data-csat="true"] button {
    width: 36px;
    height: 36px;
    margin-right: 6px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--surface);
    cursor: pointer;
  }
  #composer {
    display: flex;
    flex-shrink: 0;
    align-items: center;
    gap: 8px;
    height: 60px;
    padding: 10px 12px;
    background: var(--surface);
    border-top: 1px solid var(--border);
  }
  #composer input {
    flex: 1;
    min-width: 0;
    height: 40px;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0 10px;
    font: inherit;
  }
  #composer button {
    flex-shrink: 0;
    height: 40px;
    padding: 0 14px;
    border: 0;
    border-radius: 8px;
    background: var(--primary);
    color: #fff;
    font: inherit;
    cursor: pointer;
  }
</style>
<header>
  <div class="brand">
    <strong>💬 Aura 고객센터</strong>
    <p>보통 5분 내 응답합니다</p>
  </div>
  <div class="actions">
    <button type="button" id="help" aria-label="도움말">?</button>
    <button type="button" id="close" aria-label="닫기">✕</button>
  </div>
</header>
<section id="help-panel" hidden>
  <form id="help-search">
    <input name="q" autocomplete="off" aria-label="도움말 검색" placeholder="도움말 검색" />
  </form>
  <ul id="help-results" aria-label="도움말"></ul>
</section>
<ol id="messages" role="log"></ol>
<form id="composer">
  <input name="content" autocomplete="off" aria-label="메시지를 입력하세요" placeholder="메시지를 입력하세요" />
  <button type="submit">전송</button>
</form>
<script src="./widget.min.js"></script>
