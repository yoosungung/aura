[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aura-virtual-client"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "fastmcp>=2.0",
  "psycopg[binary]>=3.2",
  "langwatch-scenario>=0.7",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
virtual-client = "virtual_client.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
