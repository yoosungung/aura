[package]
name = "aura-control"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "aura-control-admin"
path = "src/main.rs"

[[bin]]
name = "aura-control-resolve"
path = "src/bin/aura-control-resolve.rs"

[dependencies]
aura-tenant-tx = { workspace = true }
aura-otel = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
axum = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
