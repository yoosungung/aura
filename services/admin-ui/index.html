<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Aura Admin · ops</title>
  <style>
    :root {
      --bg: #f6f3ee;
      --ink: #1a1a1a;
      --accent: #0b6e4f;
      --banner: #fff3cd;
      --line: #d9d2c5;
      --mono: "IBM Plex Mono", ui-monospace, monospace;
      --sans: "IBM Plex Sans", "Pretendard", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--sans);
      color: var(--ink);
      background:
        radial-gradient(1200px 600px at 10% -10%, #e7f2ec 0%, transparent 55%),
        linear-gradient(180deg, #fbf8f3, var(--bg));
      min-height: 100vh;
    }
    header {
      padding: 1.25rem 1.5rem 0.75rem;
      border-bottom: 1px solid var(--line);
    }
    header h1 {
      margin: 0;
      font-size: 1.75rem;
      letter-spacing: -0.03em;
      font-weight: 650;
    }
    header p { margin: 0.35rem 0 0; color: #444; max-width: 40rem; }
    #tenant-banner {
      background: var(--banner);
      border-bottom: 1px solid #e0c76a;
      padding: 0.55rem 1.5rem;
      font-family: var(--mono);
      font-size: 0.9rem;
    }
    main {
      display: grid;
      gap: 1.25rem;
      padding: 1.25rem 1.5rem 2rem;
      max-width: 960px;
    }
    section {
      border-top: 1px solid var(--line);
      padding-top: 0.85rem;
    }
    section h2 {
      margin: 0 0 0.5rem;
      font-size: 1.05rem;
    }
    label { display: block; margin: 0.35rem 0 0.15rem; font-size: 0.85rem; }
    input, select, textarea, button {
      font: inherit;
      padding: 0.4rem 0.55rem;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: #fff;
    }
    button {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
      cursor: pointer;
    }
    button.secondary { background: #fff; color: var(--ink); }
    .row { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: end; }
    .row > * { flex: 1 1 10rem; }
    pre {
      background: #1e1e1e;
      color: #e8e8e8;
      padding: 0.75rem;
      overflow: auto;
      font-family: var(--mono);
      font-size: 0.8rem;
      border-radius: 4px;
    }
    .hint { color: #666; font-size: 0.8rem; }
  </style>
</head>
<body>
  <header>
    <h1>Aura</h1>
    <p>플랫폼 ops 관리 콘솔 — source / bundle / overlay. Chat UI 아님.</p>
  </header>
  <div id="tenant-banner">tenant: <span id="active-tenant">(none)</span></div>
  <main>
    <section id="section-auth">
      <h2>연결</h2>
      <div class="row">
        <div>
          <label for="base-url">Control admin URL</label>
          <input id="base-url" value="/api" />
        </div>
        <div>
          <label for="ops-token">Bearer token</label>
          <input id="ops-token" type="password" autocomplete="off" />
        </div>
      </div>
    </section>

    <section id="section-tenant">
      <h2>Tenant picker</h2>
      <div class="row">
        <div>
          <label for="tenant-select">Known tenants</label>
          <select id="tenant-select"></select>
        </div>
        <div>
          <label for="tenant-input">Or UUID</label>
          <input id="tenant-input" placeholder="xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx" />
        </div>
        <div>
          <button type="button" id="btn-load-tenants" class="secondary">Refresh list</button>
          <button type="button" id="btn-set-tenant">Use tenant</button>
        </div>
      </div>
    </section>

    <section id="section-sources">
      <h2>Sources</h2>
      <button type="button" id="btn-list-sources" class="secondary">List sources</button>
      <pre id="sources-out">[]</pre>
    </section>

    <section id="section-bundle">
      <h2>Bundle 등록</h2>
      <p class="hint">presign → (클라이언트 PUT) → POST /v1/sources(pending) → activate(서버 sha256)</p>
      <div class="row">
        <div><label>kind</label><select id="src-kind"><option>agent</option><option>mcp</option></select></div>
        <div><label>name</label><input id="src-name" value="demo" /></div>
        <div><label>version</label><input id="src-version" value="1.0.0" /></div>
      </div>
      <div class="row">
        <div><label>entrypoint</label><input id="src-entrypoint" value="main:factory" /></div>
        <div><label>runtime</label><select id="src-runtime"><option>nodejs</option><option>python</option><option>custom</option></select></div>
        <div><label>checksum (sha256:…)</label><input id="src-checksum" placeholder="sha256:…" /></div>
      </div>
      <label>config JSON (no runtime key)</label>
      <textarea id="src-config" rows="3">{}</textarea>
      <div class="row">
        <button type="button" id="btn-presign">Presign</button>
        <button type="button" id="btn-create-source">Create pending</button>
        <button type="button" id="btn-activate">Activate</button>
      </div>
      <label>source id (for activate/retire/overlay)</label>
      <input id="src-id" />
      <pre id="bundle-out"></pre>
    </section>

    <section id="section-overlays">
      <h2>Overlays</h2>
      <div class="row">
        <div><label>principal_id</label><input id="ov-principal" value="user-1" /></div>
        <div><label>secrets_ref</label><input id="ov-secrets-ref" placeholder="k8s:secret/…" /></div>
      </div>
      <label>config JSON</label>
      <textarea id="ov-config" rows="2">{}</textarea>
      <label>reason (delete/retire)</label>
      <input id="action-reason" />
      <div class="row">
        <button type="button" id="btn-upsert-overlay">Upsert overlay</button>
        <button type="button" id="btn-delete-overlay" class="secondary">Delete overlay</button>
        <button type="button" id="btn-retire" class="secondary">Retire source</button>
      </div>
      <pre id="overlay-out"></pre>
    </section>
  </main>
  <script src="./app.js"></script>
</body>
</html>
